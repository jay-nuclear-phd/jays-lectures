<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jay's Lectures</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#f6f7fb; --ink:#1f2330; --soft:#5d6475; --line:#e3e6ee; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; word-break:keep-all; }
  .wrap { max-width:760px; margin:0 auto; padding:0 20px; }
  header.wrap { padding-top:72px; padding-bottom:36px; }
  h1 { font-size:clamp(30px,5vw,44px); margin:0; letter-spacing:-0.02em; }
  header p { margin:12px 0 0; color:var(--soft); font-size:17px; }
  main.wrap { padding-bottom:72px; }
  .list { display:grid; gap:16px; }
  .card { display:flex; align-items:center; gap:20px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px 26px; color:inherit; text-decoration:none; transition:transform .15s, box-shadow .15s; }
  a.card:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(30,40,70,.1); }
  .icon { flex:none; width:64px; height:64px; border-radius:16px; display:grid; place-items:center; overflow:hidden; }
  .icon img { width:100%; height:100%; object-fit:contain; padding:6px; }
  .juice .icon { background:linear-gradient(110deg,#eeb05a,#f6dd8c); }
  .ai .icon { background:linear-gradient(135deg,#5b7cfa,#8f6bf2); color:#fff; font-weight:800; font-size:22px; }
  .t { display:block; font-size:21px; font-weight:700; }
  .s { display:block; font-size:15px; color:var(--soft); margin-top:5px; }
  .badge { margin-left:auto; flex:none; font-size:13px; font-weight:700; color:var(--soft); background:#eef0f5; border-radius:999px; padding:4px 12px; }
  .card.soon { cursor:default; }
</style>
</head>
<body>
<header class="wrap">
  <h1>Jay's Lectures</h1>
  <p>강의 자료 모음</p>
</header>
<main class="wrap">
  <div class="list">
    <a class="card juice" href="dream_juice/index.html">
      <span class="icon"><img src="dream_juice/assets/juice.png" alt=""></span>
      <span><span class="t">드림주스</span><span class="s">꿈꾸는 군인의 건강한 주식스터디</span></span>
    </a>
    <a class="card ai" href="ai_basics/index.html">
      <span class="icon">AI</span>
      <span><span class="t">AI 문맹탈출을 위한 기본 도구 익히기</span><span class="s">터미널 · 마크다운과 옵시디언 · 깃허브 · 실습: 작가 홈페이지</span></span>
    </a>
  </div>
</main>
</body>
</html>
